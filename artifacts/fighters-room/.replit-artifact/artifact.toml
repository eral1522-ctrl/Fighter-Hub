kind = "web"
previewPath = "/"
title = "FightersRoom"
version = "1.0.0"
id = "artifacts/fighters-room"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 26141

[services.development]
run = "pnpm --filter @workspace/fighters-room run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/fighters-room", "run", "build" ]
publicDir = "artifacts/fighters-room/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/"
to = "/index.html"

[[services.production.rewrites]]
from = "/sign-in"
to = "/index.html"

[[services.production.rewrites]]
from = "/sign-in/*"
to = "/index.html"

[[services.production.rewrites]]
from = "/sign-up"
to = "/index.html"

[[services.production.rewrites]]
from = "/sign-up/*"
to = "/index.html"

[[services.production.rewrites]]
from = "/dashboard"
to = "/index.html"

[[services.production.rewrites]]
from = "/profile"
to = "/index.html"

[[services.production.rewrites]]
from = "/admin"
to = "/index.html"

[[services.production.rewrites]]
from = "/admin/legacy"
to = "/index.html"

[[services.production.rewrites]]
from = "/admin/applications"
to = "/index.html"

[[services.production.rewrites]]
from = "/admin/opportunities"
to = "/index.html"

[[services.production.rewrites]]
from = "/admin/team"
to = "/index.html"

[[services.production.rewrites]]
from = "/apply"
to = "/index.html"

[[services.production.rewrites]]
from = "/statutes"
to = "/index.html"

[[services.production.rewrites]]
from = "/association"
to = "/index.html"

[[services.production.rewrites]]
from = "/president-message"
to = "/index.html"

[[services.production.rewrites]]
from = "/about"
to = "/index.html"

[[services.production.rewrites]]
from = "/membership"
to = "/index.html"

[[services.production.rewrites]]
from = "/news-events"
to = "/index.html"

[[services.production.rewrites]]
from = "/global-boxing-summit"
to = "/index.html"

[[services.production.rewrites]]
from = "/contact"
to = "/index.html"

[[services.production.rewrites]]
from = "/privacy-policy"
to = "/index.html"

[[services.production.rewrites]]
from = "/legal-notice"
to = "/index.html"

[services.env]
PORT = "26141"
BASE_PATH = "/"
